<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: tells iOS Safari to allow "Add to Home Screen" as a full-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI Friend" />

    <!-- PWA: toolbar/status bar color on Android Chrome -->
    <meta name="theme-color" content="#000000" />

    <!-- PWA: iOS home screen icon (Safari ignores the manifest icons array) -->
    <!-- iOS ignores the manifest icons; this is the dedicated iOS home screen icon -->
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <title>AI Friend AR</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; }
      body { background: #000; color: #fff; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
