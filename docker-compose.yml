services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      - chromadb
    # Ensures host.docker.internal resolves to the Docker host on Linux too.
    # On Docker Desktop for Windows/Mac this is automatic; this makes it explicit
    # so the backend can always reach Ollama running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── ChromaDB (optional remote mode) ───────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # ── Frontend (Vite dev server) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  chroma_data:
